name: Update profile art

on:
  schedule:
    - cron: '0 0 * * *' # Run at 00:00 every day
  workflow_dispatch:

jobs:
  update-art:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          
      - name: Fetch contributions and generate heatmap
        env:
          GH_PROFILE_USER: ${{ github.repository_owner }}
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py
          
      - name: Commit and push if changed
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add data/contributions.json contrib-heatmap.svg
          git commit -m "chore: auto-update contribution heatmap" || exit 0
          git push
