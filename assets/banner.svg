<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350">
  <defs>
    <style>
      @keyframes twinkle1 { 0%,100%{opacity:.3} 50%{opacity:1} }
      @keyframes twinkle2 { 0%,100%{opacity:.6} 50%{opacity:.15} }
      @keyframes twinkle3 { 0%,100%{opacity:.2} 50%{opacity:.9} }
      @keyframes scanline { 0%{transform:translateY(-10px)} 100%{transform:translateY(360px)} }
      @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:.9} }
      @keyframes orbGlow { 0%,100%{opacity:.25} 50%{opacity:.45} }
      @keyframes gridPulse { 0%,100%{opacity:.04} 50%{opacity:.08} }
      .t1{animation:twinkle1 3s ease-in-out infinite}
      .t2{animation:twinkle2 4s ease-in-out infinite}
      .t3{animation:twinkle3 5s ease-in-out infinite}
      .scan{animation:scanline 8s linear infinite}
      .pulse{animation:pulse 4s ease-in-out infinite}
      .orb-glow{animation:orbGlow 6s ease-in-out infinite}
      .grid{animation:gridPulse 5s ease-in-out infinite}
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="6" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="orbBlur">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="40%" stop-color="#176BFF"/>
      <stop offset="100%" stop-color="#05060A"/>
    </radialGradient>
    <radialGradient id="orbAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#176BFF" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#05060A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="#05060A"/>

  <!-- Grid lines -->
  <g class="grid" stroke="#00E5FF" stroke-width=".5" opacity=".05">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="400" y1="0" x2="400" y2="350"/>
    <line x1="600" y1="0" x2="600" y2="350"/>
    <line x1="800" y1="0" x2="800" y2="350"/>
    <line x1="1000" y1="0" x2="1000" y2="350"/>
  </g>

  <!-- Starfield -->
  <g fill="#fff">
    <circle cx="50" cy="30" r="1" class="t1" opacity=".5"/>
    <circle cx="150" cy="80" r=".8" class="t2" opacity=".4"/>
    <circle cx="230" cy="20" r="1.2" class="t3" opacity=".6"/>
    <circle cx="320" cy="120" r=".6" class="t1" opacity=".3"/>
    <circle cx="410" cy="45" r="1" class="t2" opacity=".5"/>
    <circle cx="500" cy="90" r=".7" class="t3" opacity=".4"/>
    <circle cx="580" cy="25" r="1.1" class="t1" opacity=".6"/>
    <circle cx="670" cy="110" r=".5" class="t2" opacity=".3"/>
    <circle cx="750" cy="55" r="1" class="t3" opacity=".5"/>
    <circle cx="850" cy="35" r=".9" class="t1" opacity=".4"/>
    <circle cx="950" cy="100" r="1.3" class="t2" opacity=".6"/>
    <circle cx="1050" cy="60" r=".8" class="t3" opacity=".3"/>
    <circle cx="1130" cy="130" r="1" class="t1" opacity=".5"/>
    <circle cx="80" cy="200" r=".7" class="t2" opacity=".4"/>
    <circle cx="180" cy="250" r="1" class="t3" opacity=".5"/>
    <circle cx="290" cy="300" r=".6" class="t1" opacity=".3"/>
    <circle cx="370" cy="230" r="1.2" class="t2" opacity=".6"/>
    <circle cx="470" cy="310" r=".8" class="t3" opacity=".4"/>
    <circle cx="560" cy="260" r="1" class="t1" opacity=".5"/>
    <circle cx="650" cy="330" r=".5" class="t2" opacity=".3"/>
    <circle cx="730" cy="200" r="1.1" class="t3" opacity=".6"/>
    <circle cx="830" cy="280" r=".7" class="t1" opacity=".4"/>
    <circle cx="920" cy="240" r="1" class="t2" opacity=".5"/>
    <circle cx="1010" cy="320" r=".9" class="t3" opacity=".3"/>
    <circle cx="1100" cy="250" r="1.2" class="t1" opacity=".6"/>
    <circle cx="1160" cy="300" r=".8" class="t2" opacity=".4"/>
  </g>
  <!-- Cyan stars -->
  <g fill="#00E5FF">
    <circle cx="120" cy="150" r=".8" class="t3" opacity=".3"/>
    <circle cx="340" cy="70" r=".6" class="t1" opacity=".25"/>
    <circle cx="540" cy="180" r=".9" class="t2" opacity=".3"/>
    <circle cx="770" cy="140" r=".7" class="t3" opacity=".25"/>
    <circle cx="990" cy="190" r=".8" class="t1" opacity=".3"/>
    <circle cx="160" cy="320" r=".6" class="t2" opacity=".25"/>
    <circle cx="440" cy="270" r=".7" class="t3" opacity=".3"/>
    <circle cx="680" cy="50" r=".9" class="t1" opacity=".25"/>
    <circle cx="880" cy="310" r=".6" class="t2" opacity=".3"/>
    <circle cx="1080" cy="170" r=".8" class="t3" opacity=".25"/>
  </g>

  <!-- Orb / Planet -->
  <circle cx="980" cy="90" r="120" fill="url(#orbAura)" class="orb-glow" filter="url(#orbBlur)"/>
  <circle cx="980" cy="90" r="55" fill="url(#orbGrad)" opacity=".85"/>
  <circle cx="980" cy="90" r="55" fill="none" stroke="#176BFF" stroke-width="1" opacity=".3" class="pulse"/>
  <circle cx="980" cy="90" r="70" fill="none" stroke="#8B5CF6" stroke-width=".5" opacity=".15" class="pulse"/>

  <!-- HUD Corner Brackets -->
  <g stroke="#00E5FF" stroke-width="1.5" fill="none" opacity=".5" class="pulse">
    <!-- Top-left -->
    <polyline points="20,40 20,20 40,20"/>
    <!-- Top-right -->
    <polyline points="1160,20 1180,20 1180,40"/>
    <!-- Bottom-left -->
    <polyline points="20,310 20,330 40,330"/>
    <!-- Bottom-right -->
    <polyline points="1160,330 1180,330 1180,310"/>
  </g>

  <!-- HUD side decorations -->
  <g stroke="#00E5FF" stroke-width="1" opacity=".2" class="pulse">
    <line x1="25" y1="60" x2="25" y2="120"/>
    <line x1="1175" y1="60" x2="1175" y2="120"/>
    <line x1="25" y1="230" x2="25" y2="290"/>
    <line x1="1175" y1="230" x2="1175" y2="290"/>
  </g>

  <!-- Small HUD dots -->
  <g fill="#00E5FF" opacity=".4" class="pulse">
    <circle cx="25" cy="135" r="2"/>
    <circle cx="25" cy="145" r="1.2"/>
    <circle cx="1175" cy="135" r="2"/>
    <circle cx="1175" cy="145" r="1.2"/>
  </g>

  <!-- Scanning line -->
  <rect class="scan" x="0" y="0" width="1200" height="12" fill="url(#scanGrad)"/>

  <!-- Main title -->
  <text x="600" y="155" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="60" fill="#F5F7FF" filter="url(#bigGlow)" letter-spacing="8">BHUVI-SHIP-IT</text>

  <!-- Underline accent -->
  <line x1="370" y1="172" x2="830" y2="172" stroke="#00E5FF" stroke-width="1" opacity=".4" filter="url(#glow)"/>

  <!-- Tagline -->
  <text x="600" y="205" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" fill="#00E5FF" opacity=".8" letter-spacing="4" filter="url(#glow)">ENGINEERING THE FUTURE — ONE SYSTEM AT A TIME</text>

  <!-- Status text decorations -->
  <text x="50" y="340" font-family="'Courier New',monospace" font-size="9" fill="#00E5FF" opacity=".25">SYS.INIT //PROFILE.RENDER</text>
  <text x="1150" y="340" text-anchor="end" font-family="'Courier New',monospace" font-size="9" fill="#A8B5C7" opacity=".2">v2.0.26</text>
  <text x="50" y="18" font-family="'Courier New',monospace" font-size="9" fill="#A8B5C7" opacity=".2">SECTOR.7G //NODE.ACTIVE</text>

  <!-- Subtitle role line -->
  <text x="600" y="235" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A8B5C7" opacity=".6" letter-spacing="6">SOFTWARE ENGINEER  ·  AI SYSTEMS  ·  FULL STACK</text>

  <!-- Energy trails near orb -->
  <g stroke="#176BFF" stroke-width=".8" fill="none" opacity=".2" class="pulse">
    <path d="M900,120 Q930,140 960,130"/>
    <path d="M910,60 Q940,50 960,70"/>
  </g>
</svg>
