<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="6" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="orbBlur">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="40%" stop-color="#176BFF"/>
      <stop offset="100%" stop-color="#05060A"/>
    </radialGradient>
    <radialGradient id="orbAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#176BFF" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#05060A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="350" fill="#05060A"/>

  <g stroke="#00E5FF" stroke-width=".5" opacity=".06">
    <line x1="0" y1="70" x2="1200" y2="70"/><line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/><line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="350"/><line x1="400" y1="0" x2="400" y2="350"/>
    <line x1="600" y1="0" x2="600" y2="350"/><line x1="800" y1="0" x2="800" y2="350"/>
    <line x1="1000" y1="0" x2="1000" y2="350"/>
  </g>

  <g fill="#fff">
    <circle cx="50" cy="30" r="1" opacity=".5"/><circle cx="150" cy="80" r=".8" opacity=".4"/>
    <circle cx="230" cy="20" r="1.2" opacity=".6"/><circle cx="320" cy="120" r=".6" opacity=".3"/>
    <circle cx="410" cy="45" r="1" opacity=".5"/><circle cx="500" cy="90" r=".7" opacity=".4"/>
    <circle cx="580" cy="25" r="1.1" opacity=".6"/><circle cx="670" cy="110" r=".5" opacity=".3"/>
    <circle cx="750" cy="55" r="1" opacity=".5"/><circle cx="850" cy="35" r=".9" opacity=".4"/>
    <circle cx="950" cy="100" r="1.3" opacity=".6"/><circle cx="1050" cy="60" r=".8" opacity=".3"/>
    <circle cx="1130" cy="130" r="1" opacity=".5"/><circle cx="80" cy="200" r=".7" opacity=".4"/>
    <circle cx="180" cy="250" r="1" opacity=".5"/><circle cx="290" cy="300" r=".6" opacity=".3"/>
    <circle cx="370" cy="230" r="1.2" opacity=".6"/><circle cx="470" cy="310" r=".8" opacity=".4"/>
    <circle cx="560" cy="260" r="1" opacity=".5"/><circle cx="730" cy="200" r="1.1" opacity=".6"/>
    <circle cx="830" cy="280" r=".7" opacity=".4"/><circle cx="920" cy="240" r="1" opacity=".5"/>
    <circle cx="1100" cy="250" r="1.2" opacity=".6"/>
  </g>
  <g fill="#00E5FF">
    <circle cx="120" cy="150" r=".8" opacity=".3"/><circle cx="540" cy="180" r=".9" opacity=".3"/>
    <circle cx="770" cy="140" r=".7" opacity=".25"/><circle cx="990" cy="190" r=".8" opacity=".3"/>
    <circle cx="440" cy="270" r=".7" opacity=".3"/><circle cx="680" cy="50" r=".9" opacity=".25"/>
  </g>

  <circle cx="980" cy="90" r="120" fill="url(#orbAura)" filter="url(#orbBlur)" opacity=".35"/>
  <circle cx="980" cy="90" r="55" fill="url(#orbGrad)" opacity=".85"/>
  <circle cx="980" cy="90" r="55" fill="none" stroke="#176BFF" stroke-width="1" opacity=".3"/>

  <g stroke="#00E5FF" stroke-width="1.5" fill="none" opacity=".5">
    <polyline points="20,40 20,20 40,20"/><polyline points="1160,20 1180,20 1180,40"/>
    <polyline points="20,310 20,330 40,330"/><polyline points="1160,330 1180,330 1180,310"/>
  </g>
  <g stroke="#00E5FF" stroke-width="1" opacity=".2">
    <line x1="25" y1="60" x2="25" y2="120"/><line x1="1175" y1="60" x2="1175" y2="120"/>
    <line x1="25" y1="230" x2="25" y2="290"/><line x1="1175" y1="230" x2="1175" y2="290"/>
  </g>
  <g fill="#00E5FF" opacity=".4">
    <circle cx="25" cy="135" r="2"/><circle cx="25" cy="145" r="1.2"/>
    <circle cx="1175" cy="135" r="2"/><circle cx="1175" cy="145" r="1.2"/>
  </g>

  <text x="600" y="155" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="60" fill="#F5F7FF" filter="url(#bigGlow)" letter-spacing="8">BHUVI-SHIP-IT</text>
  <line x1="370" y1="172" x2="830" y2="172" stroke="#00E5FF" stroke-width="1" opacity=".4" filter="url(#glow)"/>
  <text x="600" y="205" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" fill="#00E5FF" opacity=".8" letter-spacing="4" filter="url(#glow)">ENGINEERING THE FUTURE — ONE SYSTEM AT A TIME</text>
  <text x="600" y="235" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#A8B5C7" opacity=".6" letter-spacing="6">SOFTWARE ENGINEER  ·  AI SYSTEMS  ·  FULL STACK</text>
  <text x="50" y="340" font-family="'Courier New',monospace" font-size="9" fill="#00E5FF" opacity=".25">SYS.INIT //PROFILE.RENDER</text>
  <text x="1150" y="340" text-anchor="end" font-family="'Courier New',monospace" font-size="9" fill="#A8B5C7" opacity=".2">v2.0.26</text>
</svg>
